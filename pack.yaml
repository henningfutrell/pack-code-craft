# pack.yaml — the craft pack: engineering doctrine for work done ON substrate.
#
# A pack is installed into a workflow repo by /workflow-template-sync:
#   template-sync.sh add <this-repo-url>
#
# `provides` is exactly the set of paths this pack owns in a workflow repo. One owner
# per path — a path also claimed by the core or by another pack is an error, refused
# before anything is written. A path dropped from this list is REMOVED from every repo
# on its next update, so retiring a skill here retires it everywhere.
#
# Every skill in this pack defers, in order: a bound repo's own law → the workflow's
# overlay at .agents/code-craft/<skill-name>.local.md → the skill's defaults. That ladder is
# what makes shipping opinion safe.

name: code-craft
version: 4

# The minimum core this pack was written against. Every skill here assumes the overlay
# convention (.agents/<pack-name>/<skill>.local.md) and the proxy rule, both of which the
# core defines. Against an older core it would half-work, and half-working reports
# nothing. 30 is the version that made packs a thing at all.
requires_core: 30

provides:
  # Canonical skill bodies + assets (proxy rule: .claude is a proxy for .agents).
  - .agents/skills/code-craft-tdd/**
  - .agents/skills/code-craft-quality/**
  - .agents/skills/code-craft-event-naming/**
  - .agents/skills/code-craft-ubiquitous-language/**
  # Discovery-frontmatter proxy stubs — Claude Code needs these to find each skill;
  # each stub's body only points at its canonical file above.
  - .claude/skills/code-craft-tdd/SKILL.md
  - .claude/skills/code-craft-quality/SKILL.md
  - .claude/skills/code-craft-event-naming/SKILL.md
  - .claude/skills/code-craft-ubiquitous-language/SKILL.md
